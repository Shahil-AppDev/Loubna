name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # ── CI gate only: catches syntax/type errors before we touch the VPS ──
      # The build output is NOT transferred; the server builds its own copy so
      # that native modules (bcrypt, etc.) are compiled for the VPS OS/glibc.
      - name: Build Next.js (CI gate — not deployed)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://juriste-droit-du-travail.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          SUMUP_WEBHOOK_SECRET: ${{ secrets.SUMUP_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUMUP_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_SUMUP_PUBLIC_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # ── Transfer source ONLY (no node_modules, no .next) ──────────────────
      # Server runs `npm ci` + `npm run build` so native modules are compiled
      # against the VPS glibc — avoids 400 errors on _next/static caused by
      # a crashed Next.js process due to incompatible pre-built binaries.
      - name: Transfer source to VPS
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync

          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          REMOTE="${{ secrets.HETZNER_DEPLOY_USER }}@${{ secrets.HETZNER_DEPLOY_HOST }}"
          PORT="${{ secrets.HETZNER_DEPLOY_PORT }}"
          TEMP="/tmp/loubna-build-${{ github.sha }}"

          # Pin host key via keyscan (avoids blind StrictHostKeyChecking=no)
          ssh-keyscan -p "$PORT" -H "${{ secrets.HETZNER_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "$PORT" "$REMOTE" "mkdir -p $TEMP"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p $PORT" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '*.log' \
            . \
            "$REMOTE:$TEMP/"

          rm -f ~/.ssh/deploy_key

      # ── Build + deploy on the VPS ──────────────────────────────────────────
      - name: Build and deploy on server
        env:
          NEXT_PUBLIC_SITE_URL: https://juriste-droit-du-travail.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          SUMUP_WEBHOOK_SECRET: ${{ secrets.SUMUP_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUMUP_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_SUMUP_PUBLIC_KEY }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.HETZNER_DEPLOY_PORT }}" -H "${{ secrets.HETZNER_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${{ secrets.HETZNER_DEPLOY_PORT }}" "${{ secrets.HETZNER_DEPLOY_USER }}@${{ secrets.HETZNER_DEPLOY_HOST }}" \
            "NEXT_PUBLIC_SITE_URL='$NEXT_PUBLIC_SITE_URL' \
             RESEND_API_KEY='$RESEND_API_KEY' \
             CONTACT_EMAIL_TO='$CONTACT_EMAIL_TO' \
             CONTACT_EMAIL_FROM='$CONTACT_EMAIL_FROM' \
             SUMUP_API_KEY='$SUMUP_API_KEY' \
             SUMUP_MERCHANT_CODE='$SUMUP_MERCHANT_CODE' \
             SUMUP_WEBHOOK_SECRET='$SUMUP_WEBHOOK_SECRET' \
             NEXT_PUBLIC_SUMUP_PUBLIC_KEY='$NEXT_PUBLIC_SUMUP_PUBLIC_KEY' \
             POSTGRES_HOST='$POSTGRES_HOST' \
             POSTGRES_PORT='$POSTGRES_PORT' \
             POSTGRES_DATABASE='$POSTGRES_DATABASE' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             SESSION_SECRET='$SESSION_SECRET' \
             bash -s" << 'EOF'
            set -eo pipefail

            setup_node() {
              if command -v node >/dev/null 2>&1; then
                echo "✓ Node $(node -v) — npm $(npm -v)"
                return 0
              fi
              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
              fi
              if command -v node >/dev/null 2>&1; then
                echo "✓ Node $(node -v) via NVM — npm $(npm -v)"
                return 0
              fi
              NODE_BIN=$(find "$HOME" /usr/local /opt -path '*/bin/node' -type f 2>/dev/null | head -1 || true)
              if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
                export PATH="$(dirname "$NODE_BIN"):$PATH"
                echo "✓ Node $(node -v) (found) — npm $(npm -v)"
                return 0
              fi
              if bash -lc 'command -v node' >/dev/null 2>&1; then
                NODE_BIN=$(bash -lc 'command -v node')
                export PATH="$(dirname "$NODE_BIN"):$PATH"
                echo "✓ Node $(node -v) (login shell) — npm $(npm -v)"
                return 0
              fi
              echo "⚠ Node absent — installation via nodesource..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
              command -v node >/dev/null 2>&1 || { echo "❌ Échec installation Node"; exit 1; }
              echo "✓ Node $(node -v) installé — npm $(npm -v)"
            }

            pm2_cmd() {
              if command -v pm2 >/dev/null 2>&1; then
                pm2 "$@"
                return $?
              fi
              bash -lc "pm2 $*"
            }

            setup_node

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            TEMP="/tmp/loubna-build-${{ github.sha }}"
            APP_NAME="nextjs-loubna"
            PORT=5901

            # ── Inject .env.local ──────────────────────────────────────────
            echo "=== [1/6] Injection .env.local ==="
            if [ -f "$DEPLOY_PATH/current/.env.local" ]; then
              cp "$DEPLOY_PATH/current/.env.local" "$TEMP/.env.local"
              echo "✓ .env.local copié depuis current"
            else
              touch "$TEMP/.env.local"
              echo "⚠ Aucun .env.local dans current — fichier vide créé"
            fi

            ENV_FILE="$TEMP/.env.local"

            if [ -n "${RESEND_API_KEY:-}" ]; then
              grep -v -E '^(RESEND_API_KEY|CONTACT_EMAIL_TO|CONTACT_EMAIL_FROM)=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
              mv "${ENV_FILE}.tmp" "$ENV_FILE"
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> "$ENV_FILE"
              printf 'CONTACT_EMAIL_TO=%s\n' "${CONTACT_EMAIL_TO:-louamjuristeconseil@gmail.com}" >> "$ENV_FILE"
              printf 'CONTACT_EMAIL_FROM=%s\n' "${CONTACT_EMAIL_FROM:-Loubna Abouz Manta <contact@juriste-droit-du-travail.com>}" >> "$ENV_FILE"
              echo "✓ Variables Resend écrites"
            else
              echo "⚠ RESEND_API_KEY absent"
            fi

            if [ -n "${SUMUP_API_KEY:-}" ]; then
              grep -v -E '^(SUMUP_API_KEY|SUMUP_MERCHANT_CODE|SUMUP_WEBHOOK_SECRET|NEXT_PUBLIC_PAYMENT_PROVIDER|NEXT_PUBLIC_SUMUP_PUBLIC_KEY|SUMUP_BASE_URL|SUMUP_CURRENCY)=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
              mv "${ENV_FILE}.tmp" "$ENV_FILE"
              printf 'SUMUP_API_KEY=%s\n' "$SUMUP_API_KEY" >> "$ENV_FILE"
              printf 'SUMUP_MERCHANT_CODE=%s\n' "${SUMUP_MERCHANT_CODE:-}" >> "$ENV_FILE"
              printf 'SUMUP_WEBHOOK_SECRET=%s\n' "${SUMUP_WEBHOOK_SECRET:-}" >> "$ENV_FILE"
              printf 'SUMUP_BASE_URL=https://api.sumup.com\n' >> "$ENV_FILE"
              printf 'SUMUP_CURRENCY=EUR\n' >> "$ENV_FILE"
              printf 'NEXT_PUBLIC_PAYMENT_PROVIDER=sumup\n' >> "$ENV_FILE"
              printf 'NEXT_PUBLIC_SUMUP_PUBLIC_KEY=%s\n' "${NEXT_PUBLIC_SUMUP_PUBLIC_KEY:-}" >> "$ENV_FILE"
              echo "✓ Variables SumUp écrites"
            else
              echo "⚠ SUMUP_API_KEY absent"
            fi

            # ── Inject NEXT_PUBLIC_SITE_URL ────────────────────────────────
            if [ -n "${NEXT_PUBLIC_SITE_URL:-}" ]; then
              grep -v -E '^NEXT_PUBLIC_SITE_URL=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
              mv "${ENV_FILE}.tmp" "$ENV_FILE"
              printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL" >> "$ENV_FILE"
              echo "✓ NEXT_PUBLIC_SITE_URL écrit"
            fi

            # ── Inject PostgreSQL + Session ────────────────────────────────
            if [ -n "${POSTGRES_PASSWORD:-}" ]; then
              grep -v -E '^(POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DATABASE|POSTGRES_USER|POSTGRES_PASSWORD|SESSION_SECRET)=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
              mv "${ENV_FILE}.tmp" "$ENV_FILE"
              printf 'POSTGRES_HOST=%s\n' "${POSTGRES_HOST:-localhost}" >> "$ENV_FILE"
              printf 'POSTGRES_PORT=%s\n' "${POSTGRES_PORT:-5432}" >> "$ENV_FILE"
              printf 'POSTGRES_DATABASE=%s\n' "${POSTGRES_DATABASE:-loubna_db}" >> "$ENV_FILE"
              printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER:-postgres}" >> "$ENV_FILE"
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> "$ENV_FILE"
              printf 'SESSION_SECRET=%s\n' "${SESSION_SECRET:-}" >> "$ENV_FILE"
              echo "✓ Variables PostgreSQL + Session écrites"
            else
              echo "⚠ POSTGRES_PASSWORD absent"
            fi

            # ── Install deps on server (native modules compiled for VPS) ──
            echo "=== [2/6] npm ci sur le serveur ==="
            cd "$TEMP"
            npm ci 2>&1 | tail -3

            # ── Build on server ────────────────────────────────────────────
            echo "=== [3/6] npm run build sur le serveur ==="
            npm run build 2>&1 | tail -15

            # ── Run DB migration (idempotent) ──────────────────────────────
            echo "=== [4/6] Migration DB ==="
            if [ -f "$TEMP/migrate_payment_gated.sql" ]; then
              PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${POSTGRES_HOST:-127.0.0.1}" -p "${POSTGRES_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DATABASE}" -f "$TEMP/migrate_payment_gated.sql" 2>&1 || echo "⚠ Migration warning (may already be applied)"
              echo "✓ Migration exécutée"
            else
              echo "⚠ Pas de fichier de migration — ignoré"
            fi

            # ── Atomic swap via mv (instant) — old dir deleted later ───────
            echo "=== [5/6] Swap atomique ==="
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            TRASH="trash-$(date +%s)"
            if [ -d current ]; then
              mv current "$TRASH"
            fi
            mv "$TEMP" "$DEPLOY_PATH/current"
            echo "✓ Swap effectué"

            # ── Restart PM2 (delete + free port + fresh start) ─────────────
            echo "=== [6/6] Restart PM2 ==="
            setup_node
            cd "$DEPLOY_PATH/current"

            echo "— PM2 processes avant nettoyage :"
            pm2_cmd list || true

            pm2_cmd delete "$APP_NAME" 2>/dev/null || true
            # Purge le dump pm2 pour qu'une résurrection ne ramène pas l'ancienne app
            pm2_cmd save --force 2>/dev/null || true

            # Libère le port : kill du listener ET de son superviseur (un parent
            # type pm2/npm relance le process en boucle sinon — cause EADDRINUSE)
            PORT_FREE=0
            for i in $(seq 1 12); do
              PIDS=$(ss -tlnp "sport = :$PORT" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | sort -u || true)
              if [ -z "$PIDS" ]; then
                echo "✓ Port $PORT libre"
                PORT_FREE=1
                break
              fi
              echo "— Port $PORT occupé (tentative $i) :"
              for PID in $PIDS; do
                ps -o pid=,ppid=,user=,cmd= -p "$PID" 2>/dev/null || true
                PPID_=$(ps -o ppid= -p "$PID" 2>/dev/null | tr -d ' ' || true)
                if [ -n "$PPID_" ] && [ "$PPID_" != "1" ] && [ "$PPID_" != "0" ]; then
                  echo "  parent :"
                  ps -o pid=,ppid=,user=,cmd= -p "$PPID_" 2>/dev/null || true
                  kill -9 "$PPID_" 2>/dev/null || true
                fi
                kill -9 "$PID" 2>/dev/null || true
              done
              # Au bout de 6 essais : tue tous les démons PM2 (un autre démon résurrecte l'app)
              if [ "$i" -ge 6 ]; then
                echo "  ⚠ Fallback : pkill des démons PM2 parasites"
                pkill -9 -f 'PM2 v' 2>/dev/null || true
                pkill -9 -f 'pm2.*God Daemon' 2>/dev/null || true
              fi
              sleep 2
            done

            if [ "$PORT_FREE" -ne 1 ]; then
              echo "❌ Impossible de libérer le port $PORT"
              ss -tlnp "sport = :$PORT" 2>/dev/null || true
              ps aux | grep -Ei 'pm2|next|node' | grep -v grep || true
              systemctl list-units --type=service --state=running 2>/dev/null | grep -Ei 'pm2|node|next|loubna' || true
              exit 1
            fi

            PORT=$PORT pm2_cmd start npm --name "$APP_NAME" -- start
            pm2_cmd save

            # ── Purge nginx proxy cache + reload ───────────────────────────
            echo "=== Purge cache nginx + reload ==="
            CACHE_DIRS=$(grep -rhoP 'proxy_cache_path\s+\K\S+' /etc/nginx/ 2>/dev/null || true)
            if [ -n "$CACHE_DIRS" ]; then
              for d in $CACHE_DIRS; do
                echo "  Purge $d"
                rm -rf "${d:?}"/* 2>/dev/null || true
              done
            fi
            rm -rf /var/cache/nginx/* 2>/dev/null || true
            nginx -t 2>/dev/null && { systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true; echo "✓ nginx rechargé"; } || echo "⚠ nginx -t a échoué"

            # ── Delete old build(s) in background (avoid OOM-killing deploy) ─
            cd "$DEPLOY_PATH"
            nohup nice -n 19 ionice -c 3 rm -rf trash-* >/dev/null 2>&1 &
            echo "✓ Nettoyage anciens builds lancé en arrière-plan"

            sleep 8

            # ── Local health check + new-build verification ────────────────
            echo "=== Validation localhost ==="
            HTTP=$(curl -so /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT" || echo "000")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "307" ] || [ "$HTTP" = "301" ]; then
              echo "✅ App répond HTTP $HTTP sur le port $PORT"
            else
              echo "❌ App a retourné HTTP $HTTP"
              pm2_cmd logs "$APP_NAME" --lines 50 --nostream || true
              exit 1
            fi

            BUILD_ID=$(cat "$DEPLOY_PATH/current/.next/BUILD_ID")
            echo "BUILD_ID attendu : $BUILD_ID"
            if curl -s "http://127.0.0.1:$PORT" | grep -q "$BUILD_ID"; then
              echo "✅ Le nouveau build ($BUILD_ID) est bien servi"
            else
              echo "❌ Le HTML servi ne référence pas le nouveau build !"
              echo "— Diagnostic PM2 :"
              pm2_cmd list || true
              pm2_cmd describe "$APP_NAME" || true
              echo "— Processus sur le port $PORT :"
              ss -tlnp 2>/dev/null | grep ":$PORT" || true
              exit 1
            fi
            echo "✅ Déploiement terminé"
          EOF

          rm -f ~/.ssh/deploy_key

      # ── Public HTTPS health check ──────────────────────────────────────────
      - name: Health check (public HTTPS)
        run: |
          set -euo pipefail
          for URL in "https://juriste-droit-du-travail.com" "https://www.juriste-droit-du-travail.com"; do
            echo "Vérification $URL ..."
            OK=0
            for attempt in 1 2 3 4 5 6; do
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 "$URL" || echo "000")
              echo "  tentative $attempt : HTTP $CODE"
              if [ "$CODE" = "200" ]; then OK=1; break; fi
              sleep 10
            done
            if [ "$OK" -ne 1 ]; then
              echo "❌ Health check échoué pour $URL"
              curl -sSI --max-time 30 "$URL" || true
              exit 1
            fi
            echo "✅ $URL est en ligne (HTTP 200)"
          done

name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js (CI gate)
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          SUMUP_WEBHOOK_SECRET: ${{ secrets.SUMUP_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUMUP_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_SUMUP_PUBLIC_KEY }}

      - name: Write .env.local from secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          CONTACT_EMAIL_FROM: ${{ secrets.CONTACT_EMAIL_FROM }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          SUMUP_WEBHOOK_SECRET: ${{ secrets.SUMUP_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUMUP_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_SUMUP_PUBLIC_KEY }}
        run: |
          cat > .env.local << 'ENVEOF'
          ENVEOF
          [ -n "$RESEND_API_KEY" ] && printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> .env.local || echo "⚠ RESEND_API_KEY not set"
          [ -n "$CONTACT_EMAIL_TO" ] && printf 'CONTACT_EMAIL_TO=%s\n' "$CONTACT_EMAIL_TO" >> .env.local
          [ -n "$CONTACT_EMAIL_FROM" ] && printf 'CONTACT_EMAIL_FROM=%s\n' "$CONTACT_EMAIL_FROM" >> .env.local
          [ -n "$SUMUP_API_KEY" ] && printf 'SUMUP_API_KEY=%s\n' "$SUMUP_API_KEY" >> .env.local || echo "⚠ SUMUP_API_KEY not set"
          [ -n "$SUMUP_MERCHANT_CODE" ] && printf 'SUMUP_MERCHANT_CODE=%s\n' "$SUMUP_MERCHANT_CODE" >> .env.local
          [ -n "$SUMUP_WEBHOOK_SECRET" ] && printf 'SUMUP_WEBHOOK_SECRET=%s\n' "$SUMUP_WEBHOOK_SECRET" >> .env.local
          printf 'SUMUP_BASE_URL=https://api.sumup.com\n' >> .env.local
          printf 'SUMUP_CURRENCY=EUR\n' >> .env.local
          printf 'NEXT_PUBLIC_PAYMENT_PROVIDER=sumup\n' >> .env.local
          [ -n "$NEXT_PUBLIC_SUMUP_PUBLIC_KEY" ] && printf 'NEXT_PUBLIC_SUMUP_PUBLIC_KEY=%s\n' "$NEXT_PUBLIC_SUMUP_PUBLIC_KEY" >> .env.local
          echo "✓ .env.local written ($(wc -l < .env.local) lines)"

      - name: Transfer build artifact to VPS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          REMOTE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          TEMP="/tmp/loubna-build-${{ github.sha }}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$PORT" "$REMOTE" "mkdir -p $TEMP"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p $PORT" \
            --exclude '.git' \
            --exclude '*.log' \
            . \
            "$REMOTE:$TEMP/"

          rm -f ~/.ssh/deploy_key

      - name: Swap and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: "10m"
          script: |
            set -eo pipefail

            setup_node() {
              if command -v node >/dev/null 2>&1; then
                echo "✓ Node $(node -v) — npm $(npm -v)"
                return 0
              fi
              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
              if [ -s "$NVM_DIR/nvm.sh" ]; then
                # shellcheck disable=SC1090
                . "$NVM_DIR/nvm.sh"
              fi
              if command -v node >/dev/null 2>&1; then
                echo "✓ Node $(node -v) — npm $(npm -v)"
                return 0
              fi
              NODE_BIN=$(find "$HOME" /usr/local /opt -path '*/bin/node' -type f 2>/dev/null | head -1 || true)
              if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN" ]; then
                export PATH="$(dirname "$NODE_BIN"):$PATH"
                echo "✓ Node $(node -v) — npm $(npm -v)"
                return 0
              fi
              if bash -lc 'command -v node' >/dev/null 2>&1; then
                NODE_BIN=$(bash -lc 'command -v node')
                export PATH="$(dirname "$NODE_BIN"):$PATH"
                echo "✓ Node $(node -v) (login shell) — npm $(npm -v)"
                return 0
              fi
              if command -v sudo >/dev/null 2>&1; then
                echo "⚠ Node absent — tentative installation Node.js 20 (nodesource)..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi
              if command -v node >/dev/null 2>&1; then
                echo "✓ Node $(node -v) installé — npm $(npm -v)"
                return 0
              fi
              echo "❌ Node.js introuvable sur le serveur (PATH=$PATH)"
              exit 1
            }

            pm2_cmd() {
              if command -v pm2 >/dev/null 2>&1; then
                pm2 "$@"
                return $?
              fi
              bash -lc "pm2 $*"
            }

            setup_node

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            TEMP="/tmp/loubna-build-${{ github.sha }}"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            APP_NAME="nextjs-loubna"
            PORT=3000

            echo "=== Atomic swap current → backup, new build → current ==="
            if [ -d "$DEPLOY_PATH/current" ]; then
              mv "$DEPLOY_PATH/current" "$DEPLOY_PATH/backup-$TIMESTAMP"
            fi
            mv "$TEMP" "$DEPLOY_PATH/current"

            cd "$DEPLOY_PATH"
            ls -dt backup-* 2>/dev/null | tail -n +4 | xargs -r rm -rf

            echo "=== Restart PM2 ==="
            setup_node
            cd "$DEPLOY_PATH/current"
            if pm2_cmd list 2>/dev/null | grep -q "$APP_NAME"; then
              pm2_cmd restart "$APP_NAME" --update-env
            else
              PORT=$PORT pm2_cmd start npm --name "$APP_NAME" -- start
            fi
            pm2_cmd save

            sleep 8

            echo "=== Validation (localhost) ==="
            HTTP=$(curl -so /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT" || echo "000")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "307" ] || [ "$HTTP" = "301" ]; then
              echo "✅ App responds HTTP $HTTP on port $PORT"
            else
              echo "❌ App returned HTTP $HTTP — check pm2 logs $APP_NAME"
              pm2_cmd logs "$APP_NAME" --lines 40 --nostream || true
              exit 1
            fi

            echo "✅ Deployment complete"

      - name: Health check (public HTTPS)
        run: |
          set -euo pipefail
          URLS=(
            "https://juriste-droit-du-travail.com"
            "https://www.juriste-droit-du-travail.com"
          )
          for URL in "${URLS[@]}"; do
            echo "Checking $URL ..."
            OK=0
            for attempt in 1 2 3 4 5 6; do
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 30 "$URL" || echo "000")
              echo "  attempt $attempt: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                OK=1
                break
              fi
              sleep 10
            done
            if [ "$OK" -ne 1 ]; then
              echo "❌ Health check failed for $URL"
              curl -sSI --max-time 30 "$URL" || true
              exit 1
            fi
            echo "✅ $URL is live (HTTP 200)"
          done
